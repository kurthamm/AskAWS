<!DOCTYPE html>
<html>
  <head>
    <title>Ask AWS</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        font-family: Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        margin: 0;
        padding: 0;
      }
      header {
        background-color: #232f3e;
        color: white;
        padding: 20px;
        text-align: center;
      }
      h1 {
        margin: 0;
      }
      main {
        margin: 20px;
      }
      input[type="text"] {
        width: 100%;
        height: 60px;
        padding: 12px 20px;
        box-sizing: border-box;
        border: 2px solid #ccc;
        border-radius: 4px;
        resize: vertical;
      }
      input[type="submit"] {
        background-color: #4CAF50;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      input[type="submit"]:hover {
        background-color: #45a049;
      }
      .answer {
        margin-top: 20px;
      }
      footer {
        background-color: #f2f2f2;
        padding: 20px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Ask AWS</h1>
    </header>
    <main>
      <form method="POST">
        <label for="question">Enter your question:</label>
        <input type="text" id="question" name="question" rows="3" placeholder="Type your question here...">
        <input type="submit" value="Submit">
      </form>
      {% if answer %}
        <div class="answer">
          <h2>Answer:</h2>
          <p>{{ answer }}</p>
        </div>
      {% endif %}
    </main>
    <footer>
      <p><em>Disclaimer: Please validate all answers before using them.</em></p>
    </footer>
  </body>
</html>
